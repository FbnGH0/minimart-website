<!DOCTYPE html>
<!--
  products.html = the PRODUCTS page.
  It shares style.css and script.js with the home page. Styles used only
  on this page are in section 9 of style.css, and <body class="products-page">
  makes sure they only apply here.

  Layout, top to bottom:
    0. Nav bar      – same as the home page, but always visible here
    1. Page header  – short version of the home page hero
    2. Products     – one section per category, loaded from Supabase
                      (products and categories are managed on admin.html)
    3. Footer
    4. Google Translate – same floating language button
-->
<html lang="en">
<head>
  <link rel="icon" href="images/logo.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Great Luck Minimart</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="products-page">

  <!-- ===== 0. NAV BAR: same as the home page ===== -->
  <!-- Links to the home page sections need "index.html" in front of the # -->
  <nav class="site-nav" aria-label="Main">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand notranslate">
        <img src="images/logo.png" alt="">
        <span>Great Luck Minimart</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html#find-us">Visit Us</a></li>
        <li><a href="index.html#socials">Follow Us</a></li>
        <!-- "current" marks the page you're on -->
        <li><a href="products.html" class="nav-cta current" aria-current="page">Products</a></li>
      </ul>
    </div>
  </nav>

  <!--
    ===== 1. PAGE HEADER =====
    Keeps class="hero" because script.js looks for an element with that
    class (it uses it to decide when to show the nav). "page-hero" is the
    shorter version defined in section 9 of style.css.
  -->
  <header class="hero page-hero" id="top">
    <h1>Our Products</h1>
    <p class="tagline">Fresh finds and favourites from home</p>
  </header>

  <main>

    <!-- ===== 2. PRODUCTS ===== -->
    <section id="products" class="section section-alt products-section reveal">
      <div class="container center">
        <!--
          The heading and description are edited on admin.html. The text
          typed here is a backup in case the database can't be reached.
        -->
        <h2 id="products-heading">What's on the Shelf</h2>
        <p id="products-description">Short description of your products goes here.</p>

        <!-- Quick links to each category; products.js fills these in -->
        <nav class="category-chips" id="category-chips" aria-label="Product categories" hidden></nav>

        <!--
          CATALOG: products.js builds one section per category in here,
          each with a heading and a grid of product cards. The message
          below shows until they arrive.
        -->
        <div class="catalog" id="catalog">
          <p class="grid-message">Loading products…</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== 3. FOOTER ===== -->
  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Great Luck Minimart</p>
  </footer>

  <!--
    ===== 4. GOOGLE TRANSLATE =====
    Identical to the home page. The chosen language is remembered in a
    cookie, so it carries over when visitors move between pages.
  -->
  <div class="translate-box notranslate">
    <i class="fa-solid fa-globe" aria-hidden="true"></i>
    <select id="lang-select" aria-label="Choose language">
      <option value="en">English</option>
      <option value="my">မြန်မာ</option>
      <option value="zh-CN">中文</option>
      <option value="ms">Bahasa Melayu</option>
      <option value="ta">தமிழ்</option>
    </select>
    <div id="google_translate_element"></div>
  </div>

  <!--
    Order matters: Supabase's library, then supabase-config.js (creates
    "db"), then site-common.js (shared helpers), then products.js.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
  <script src="supabase-config.js"></script>
  <script src="site-common.js"></script>
  <script src="products.js"></script>
  <script src="script.js"></script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
